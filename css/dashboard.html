<!-- RIGHT PANEL: DASHBOARD & JOB LIST TABLE (58% Width) -->
<section class="w-full md:w-[58%] bg-slate-950 flex flex-col h-full overflow-hidden p-4">
  
  <!-- SUMMARY METRICS CARDS -->
  <div class="grid grid-cols-5 gap-2 mb-3 shrink-0">
    <div class="bg-slate-900 border border-slate-800 rounded-lg p-2 text-center">
      <p class="text-[11px] text-slate-400">Total Jobs</p>
      <p id="metricTotal" class="text-xl font-bold text-white">0</p>
    </div>
    <div class="bg-slate-900 border border-amber-500/30 bg-amber-500/5 rounded-lg p-2 text-center">
      <p class="text-[11px] text-amber-400">Pending</p>
      <p id="metricPending" class="text-xl font-bold text-amber-400">0</p>
    </div>
    <div class="bg-slate-900 border border-cyan-500/30 bg-cyan-500/5 rounded-lg p-2 text-center">
      <p class="text-[11px] text-cyan-400">Inspected</p>
      <p id="metricInspected" class="text-xl font-bold text-cyan-400">0</p>
    </div>
    <div class="bg-slate-900 border border-emerald-500/30 bg-emerald-500/5 rounded-lg p-2 text-center">
      <p class="text-[11px] text-emerald-400">OK</p>
      <p id="metricOk" class="text-xl font-bold text-emerald-400">0</p>
    </div>
    <div class="bg-slate-900 border border-rose-500/30 bg-rose-500/5 rounded-lg p-2 text-center">
      <p class="text-[11px] text-rose-400">NG</p>
      <p id="metricNg" class="text-xl font-bold text-rose-400">0</p>
    </div>
  </div>

  <!-- SEARCH & FILTER TOOLBAR -->
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 mb-3 shrink-0 flex flex-wrap gap-2 items-center">

    <div class="relative flex-1 min-w-[160px]">
      <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-xs text-slate-400"></i>

      <input
        type="text"
        id="searchInput"
        oninput="applyFilters()"
        placeholder="ค้นหา Job, Part No, FA NO, Diecut..."
        class="w-full bg-slate-950 border border-slate-700 rounded-md pl-8 pr-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
      >
    </div>

    <select
      id="filterStatus"
      onchange="applyFilters()"
      class="bg-slate-950 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200 focus:outline-none"
    >
      <option value="ALL">สถานะ: ทั้งหมด</option>
      <option value="Pending">Pending</option>
      <option value="Inspected">Inspected</option>
    </select>

    <select
      id="filterResult"
      onchange="applyFilters()"
      class="bg-slate-950 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200 focus:outline-none"
    >
      <option value="ALL">ผลตรวจ: ทั้งหมด</option>
      <option value="OK">OK</option>
      <option value="NG">NG</option>
      <option value="-">- (Pending)</option>
    </select>

    <select
      id="filterCustomer"
      onchange="applyFilters()"
      class="bg-slate-950 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200 focus:outline-none max-w-[130px] truncate"
    >
      <option value="ALL">ลูกค้า: ทั้งหมด</option>
    </select>

    <select
      id="filterTopicAdmin"
      onchange="applyFilters()"
      class="hidden bg-cyan-950 border border-cyan-700 rounded-md px-2 py-1.5 text-xs text-cyan-200 focus:outline-none"
    >
      <option value="CURRENT">หัวข้อปัจจุบัน</option>
      <option value="ALL">ทุกหัวข้อ (Global)</option>
    </select>

    <button
      onclick="loadSystemData()"
      class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-md border border-slate-700"
      title="รีเฟรชข้อมูล"
    >
      <i class="fa-solid fa-rotate"></i>
    </button>
  </div>

  <!-- JOB LIST TABLE -->
  <div class="flex-1 bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex flex-col">

    <div class="overflow-x-auto flex-1">
      <table class="w-full text-left text-xs text-slate-300">

        <thead class="bg-slate-950 border-b border-slate-800 text-slate-400 sticky top-0 uppercase tracking-wider">
          <tr>
            <th class="p-2.5">Job No</th>
            <th class="p-2.5">Part No / Rev</th>
            <th class="p-2.5">Customer</th>
            <th class="p-2.5">ส่งงานโดย / เวลา</th>
            <th class="p-2.5 text-center">Status</th>
            <th class="p-2.5 text-center">Result</th>
            <th class="p-2.5 text-right">Action</th>
          </tr>
        </thead>

        <tbody id="jobTableBody" class="divide-y divide-slate-800/60">
          <!-- Dynamic Rows -->
        </tbody>

      </table>
    </div>

    <div class="bg-slate-950 border-t border-slate-800 px-3 py-1.5 flex justify-between items-center text-[11px] text-slate-400">
      <span id="tableCountText">แสดง 0 รายการ</span>
      <span id="topicIndicatorText" class="text-cyan-400 font-medium">
        Topic: DIECUT INSPECTION
      </span>
    </div>

  </div>

</section>
